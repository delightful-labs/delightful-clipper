name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    name: Tooling, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.22.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Preserve generated test counterexamples
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xstate-counterexamples
          path: .xstate-test/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  browser:
    name: Account, library and offline browser tests
    runs-on: ubuntu-24.04
    container:
      # Match @playwright/test in package.json; browsers and OS libraries are preinstalled.
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 10.22.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify preinstalled browsers
        timeout-minutes: 2
        run: |
          node <<'NODE'
          const { chromium, firefox } = require('@playwright/test')
          ;(async () => {
            for (const browserType of [chromium, firefox]) {
              const browser = await browserType.launch()
              console.log(`${browserType.name()}: ${browser.version()}`)
              await browser.close()
            }
            const browser = await chromium.launch({ channel: 'chromium' })
            console.log(`Extension Chromium: ${browser.version()}`)
            await browser.close()
          })().catch(error => {
            console.error(error)
            process.exitCode = 1
          })
          NODE
      - run: pnpm test:e2e
      - run: pnpm test:schema
      - run: pnpm test:worker
      - run: pnpm test:offline
      - run: pnpm test:extension
      - run: pnpm test:fake-data
